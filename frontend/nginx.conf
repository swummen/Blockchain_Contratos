# Límites por IP. login: frena el bloqueo masivo de cuentas (RF-054) y los
# intentos de OTP; api: todo lo demás.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Detrás de Caddy la IP real llega en X-Forwarded-For; Caddy la reescribe,
    # así que el cliente no puede falsificarla.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Los navegadores ignoran HSTS por HTTP: solo actúa detrás de Caddy.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # 'unsafe-inline' en estilos: Radix posiciona menús con style="...".
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 20 MB del backend (RF-011) más el sobrecosto del multipart.
    client_max_body_size 21m;

    # Resolver de Docker y upstream en variable: nginx arranca aunque el backend
    # todavía no exista, y lo vuelve a resolver si cambia de IP.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    # Diagnóstico interno: muestra errores de Fabric, no debe salir a internet.
    location /api/fabric {
        return 404;
    }

    location ~ ^/api/auth/(login|verify-otp)$ {
        limit_req zone=login burst=10 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
    }

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
    }

    # JSON con { message }: el frontend muestra ese campo tal cual.
    error_page 429 = @too_many;
    location @too_many {
        default_type application/json;
        return 429 '{"message":"Demasiados intentos. Espera un minuto e intenta de nuevo."}';
    }
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"message":"El archivo debe ser un único PDF de hasta 20MB."}';
    }

    # Las rutas que no son archivos van a index.html: las resuelve react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
