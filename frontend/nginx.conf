server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA con react-router (BrowserRouter): cualquier ruta que no sea un
    # archivo estático cae a index.html, para que el router del cliente la
    # resuelva (ej. /system-status, /empleado/documentos).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
