# Mongo, backend y frontend, separados de la red Fabric para poder reiniciar la
# aplicación sin bajar la red. Usan la red fabric_test que crea network-up.sh.
name: contratos

services:
  mongo:
    image: mongo:7.0.41
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
    ports:
      # Solo localhost: en 0.0.0.0 expondría las credenciales por defecto a la red.
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fabric_test

  backend:
    build:
      context: ../backend
    container_name: backend
    restart: unless-stopped
    environment:
      # El contenedor siempre escucha en 8080; BACKEND_PORT solo cambia el puerto del host.
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-changeme}@mongo:27017/?authSource=admin
      # FABRIC_* usan los valores por defecto de backend/src/config/fabric.ts.
      # CORS solo importa con npm run dev: en Docker el navegador entra por el nginx
      # del frontend (mismo origen).
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${FRONTEND_PORT:-5173}}
      # Valor de desarrollo para que up.sh funcione sin configurar nada.
      JWT_SECRET: ${JWT_SECRET:-contratos-dev-secret-cambiar-en-produccion}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-60}
      # Correo del código (Brevo). Vacío: el código se imprime en docker logs backend.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@contratos.local}
      # Buzón real para los usuarios de prueba que siembra up.sh (buzon+rol@...).
      SEED_EMAIL: ${SEED_EMAIL:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      # Solo Org1 y en solo lectura (mínimo privilegio). El destino coincide con
      # FABRIC_CRYPTO_PATH de backend/src/config/fabric.ts.
      - ./fabric-samples/test-network/organizations/peerOrganizations/org1.example.com:/crypto/peerOrganizations/org1.example.com:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - fabric_test

  frontend:
    build:
      context: ../frontend
      args:
        # Se fija al compilar. Ruta relativa: el nginx del frontend la reenvía al
        # backend, así sirve igual en localhost y en el dominio público.
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    networks:
      - fabric_test

  # Solo en el servidor público: up.sh lo nombra cuando PUBLIC_DOMAIN tiene valor
  # (nombrarlo activa el perfil). HTTPS con Let's Encrypt. Es lo único que escucha fuera de 127.0.0.1.
  caddy:
    image: caddy:2.10.2-alpine
    container_name: caddy
    restart: unless-stopped
    profiles: ["publico"]
    command: caddy reverse-proxy --from ${PUBLIC_DOMAIN:-localhost} --to frontend:80
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Guarda el certificado: sin esto se pediría uno nuevo en cada arranque y
      # Let's Encrypt limita cuántos se emiten por semana.
      - caddy_data:/data
    depends_on:
      - frontend
    networks:
      - fabric_test

networks:
  fabric_test:
    external: true

volumes:
  mongo_data:
  caddy_data:
